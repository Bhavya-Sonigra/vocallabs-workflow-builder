table:
  name: workflow_steps
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_step_id
        table:
          name: step_runs
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - workflow:
              organization:
                org_members:
                  role:
                    _in:
                      - owner
                      - editor
                  user_id:
                    _eq: X-Hasura-User-Id
          - _or:
              - type:
                  _nin:
                    - db_write
                    - notify
              - workflow:
                  organization:
                    org_members:
                      role:
                        _eq: owner
                      user_id:
                        _eq: X-Hasura-User-Id
      columns:
        - step_order
        - config
        - created_at
        - type
        - id
        - workflow_id
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - step_order
        - config
        - created_at
        - type
        - id
        - workflow_id
      filter:
        workflow:
          organization:
            org_members:
              user_id:
                _eq: X-Hasura-User-Id
    comment: ""
